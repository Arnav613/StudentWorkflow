# Render free tier. Note that it sleeps when idle: the first request after a
# quiet period takes ~30s, which the frontend must show as a loading state.
services:
  - type: web
    name: ashoka-dashboard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: ashoka.edu.in
      # Classroom sync. Set false to hide the Connect button and refuse
      # connect/sync, without a frontend redeploy.
      - key: CLASSROOM_ENABLED
        value: "true"
      # Only import courses whose name contains one of these (comma
      # separated). Empty imports every non-archived course. Bump this at the
      # start of each semester.
      - key: CLASSROOM_TERM_FILTER
        value: "Monsoon 2026"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Fernet key for refresh tokens at rest. Rotating this orphans every
      # stored token — users are asked to reconnect, nothing is lost.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Shared secret for the hourly GitHub Action (phase 04). Must match the
      # CRON_SECRET repository secret exactly. Unset disables /classroom/cron/
      # sync entirely rather than leaving it open.
      - key: CRON_SECRET
        sync: false
      # --- AI, phase 09 ---------------------------------------------------
      # Off unless both of these are set. The frontend reads the pair through
      # /config as one flag and hides every AI control when it is false, so a
      # deployment with no key shows no button rather than one that 503s.
      - key: AI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      # Named here so a rate-limited afternoon is an env var, not a deploy.
      # Google retires these mid-term: 2.0-flash started 404ing in August 2026
      # with the successor named in the error body. Override in the dashboard
      # for an instant fix, then bring this line along with it.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # --- Push, phase 12 -------------------------------------------------
      # The morning digest. Same "readiness, not the flag" rule as AI above:
      # the frontend hides the reminders control unless this and both VAPID
      # keys are set, because a browser grants notification permission once
      # and a prompt from a deployment that cannot deliver spends it for
      # nothing.
      - key: PUSH_ENABLED
        value: "true"
      # Generate the pair once with `python scripts/vapid.py` in backend/.
      # Not a rotatable secret: the public half is embedded in every
      # subscription a browser has already created, so changing it invalidates
      # every row in push_subscriptions and every device must be re-enabled by
      # hand. Both are set in the dashboard — the public key is not sensitive,
      # but keeping the pair together is what stops half of it being replaced.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contact address for the push services, required by the VAPID spec.
      - key: VAPID_SUBJECT
        value: mailto:gupta.arnav006@gmail.com
      # Local hour the digest is sent, in each device's own timezone. The
      # GitHub Action ticks hourly and this is the hour it matches, so moving
      # the notification is one env var rather than a cron expression.
      - key: DIGEST_HOUR
        value: "8"
